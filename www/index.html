<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f4f5" media="(prefers-color-scheme: light)">
<title>TS</title>
<style>
:root{--ff:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;--bg:#0a0a0a;--nav:#111;--line:#2a2a2a;--dim:#8a8a8a;--fg:#fff;--on:#0a0a0a}
@media(prefers-color-scheme:light){:root{--bg:#f4f4f5;--nav:#fff;--line:#e6e6e8;--dim:#6f6f73;--fg:#0a0a0a;--on:#fff}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--ff);overflow:hidden}
#stage{position:fixed;inset:0 0 calc(56px + env(safe-area-inset-bottom,0px)) 0;padding-top:env(safe-area-inset-top,0)}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);display:none}
iframe.on{display:block;animation:fin .2s ease-out}
@keyframes fin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
nav{position:fixed;left:0;right:0;bottom:0;height:calc(56px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0);display:grid;grid-template-columns:repeat(6,1fr);background:var(--nav);border-top:1px solid var(--line);z-index:10}
nav button{position:relative;background:none;border:0;color:var(--dim);font:600 10.5px/1 var(--ff);letter-spacing:.03em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;transition:color .15s}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s cubic-bezier(.2,.8,.2,1),stroke-width .15s}
nav button.on{color:var(--fg)}
nav button.on svg{stroke-width:2.3;transform:translateY(-1px) scale(1.06)}
nav button:active svg{transform:scale(.88)}
#ind{position:absolute;top:-1px;left:0;width:16.6667%;height:2px;display:flex;justify-content:center;pointer-events:none;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
#ind i{width:26px;height:2px;border-radius:2px;background:var(--fg)}
.bd{position:absolute;top:7px;left:calc(50% + 6px);min-width:15px;height:15px;padding:0 4px;border-radius:8px;background:var(--fg);color:var(--on);font:700 9.5px/15px var(--ff);text-align:center;letter-spacing:0;display:none}
.bd.show{display:block;animation:pin .3s cubic-bezier(.2,.8,.2,1)}
@keyframes pin{from{transform:scale(0)}to{transform:scale(1)}}
@media(max-width:380px){nav button{font-size:9.5px;letter-spacing:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head>
<body>
<div id="stage"></div>
<nav aria-label="Sections">
 <span id="ind"><i></i></span>
 <button data-t="today" aria-label="Today"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>Today<b class="bd" id="bd"></b></button>
 <button data-t="coach" aria-label="Coach"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Coach</button>
 <button data-t="goals" aria-label="Goals"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".8"/></svg>Goals</button>
 <button data-t="trading" aria-label="Trading"><svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 3 8-9"/><path d="M15 5h5v5"/></svg>Trading</button>
 <button data-t="berserker" aria-label="Berserker"><svg viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M4 9l5-5M15 20l5-5M3 21l3-3M18 6l3-3"/></svg>Berserker</button>
 <button data-t="forge" aria-label="Forge"><svg viewBox="0 0 24 24"><path transform="translate(0 -1.5)" d="M2.5 7H21v3.5h-4.2c0 2-1 3.2-2.3 4.2V17H18v3H6v-3h3.5v-2.3c-1.3-1-2.3-2.2-2.3-4.2C4.6 10.5 3.2 9 2.5 7z"/></svg>Forge</button>
</nav>
<script src="version.js"></script>
<script src="shared/ts.js"></script>
<script>
var ORDER=['today','coach','goals','trading','berserker','forge'];
var APPS={today:'apps/today/index.html',coach:'apps/coach/index.html',goals:'apps/goals/index.html',trading:'apps/trading/index.html',berserker:'apps/berserker/index.html',forge:'apps/forge/index.html'};
var stage=document.getElementById('stage'),frames={},cur='today',ind=document.getElementById('ind');
function ensure(t,bg){
  if(frames[t])return false;
  /* bg=1: loaded in the background, so the app must not ask for permissions until the person opens it */
  var f=document.createElement('iframe');f.src=APPS[t]+(bg?'?bg=1':'');f.title=t;f.setAttribute('allow','autoplay');
  f.addEventListener('load',function(){f.dataset.ready='1'});
  stage.appendChild(f);frames[t]=f;return true;
}
function ping(t,msg){var f=frames[t];if(!f)return;try{f.contentWindow.postMessage(msg,'*')}catch(e){}}
function show(t,quiet){
  if(!APPS[t])t='today';
  var fresh=ensure(t);cur=t;
  for(var k in frames)frames[k].classList.toggle('on',k===t);
  document.querySelectorAll('nav button').forEach(function(b){var on=b.dataset.t===t;b.classList.toggle('on',on);if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  ind.style.transform='translateX('+ORDER.indexOf(t)*100+'%)';
  /* apps that were already loaded may hold stale data: ask them to re-read storage */
  if(!fresh)ping(t,{hubRefresh:1});
  try{localStorage.setItem('hub.tab',t)}catch(e){}
}
/* open a view inside an app once it is ready (used by Today: "session running" opens the Goals timer) */
function deepLink(t,view){
  var f=frames[t];if(!f||!view)return;
  var send=function(){ping(t,{goView:view})};
  if(f.dataset.ready)send();else f.addEventListener('load',send,{once:true});
}
document.querySelectorAll('nav button').forEach(function(b){b.onclick=function(){TS.haptic(6);show(b.dataset.t)}});
window.addEventListener('message',function(e){
  var d=e.data;if(!d||!d.hubGo)return;
  var known=false;for(var k in frames)if(frames[k].contentWindow===e.source)known=true;
  if(!known)return;
  show(d.hubGo);if(d.view)deepLink(d.hubGo,d.view);
});

/* Today badge: how many of the three daily pillars are still open. Fed by storage events from any app. */
var bd=document.getElementById('bd'),bt=0;
function badge(){
  try{
    var I=TS.index(TS.load()),left=3-I.score(TS.dkey(new Date()));
    bd.textContent=left>0?left:'✓';bd.classList.add('show');
    bd.setAttribute('aria-label',left>0?left+' left today':'All done today');
  }catch(e){}
}
window.addEventListener('storage',function(){clearTimeout(bt);bt=setTimeout(badge,250)});
document.addEventListener('visibilitychange',function(){if(!document.hidden)badge()});
setInterval(badge,60000);

var last='today';try{last=localStorage.getItem('hub.tab')||'today'}catch(e){}
show(last);badge();
/* load Today and Goals in the background so the badge, study reminders and live data are ready on every launch; Forge follows a little later so its reminders are planned again each launch too */
setTimeout(function(){ensure('today');ensure('goals')},900);
setTimeout(function(){ensure('forge',true)},2200);
/* a tapped reminder opens its app, and the right screen inside it (Forge sends {go:'forge',view:'review'}) */
function onTap(x){if(!x||!APPS[x.go])return;show(x.go);if(x.view)deepLink(x.go,x.view)}
try{var LNp=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications;
  if(LNp)LNp.addListener('localNotificationActionPerformed',function(ev){onTap(ev&&ev.notification&&ev.notification.extra)})}catch(e){}
/* Android back button: go to Today first, exit only from Today */
try{var AP=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;
  if(AP)AP.addListener('backButton',function(){if(cur!=='today')show('today');else AP.exitApp()})}catch(e){}
</script>
</body></html>
